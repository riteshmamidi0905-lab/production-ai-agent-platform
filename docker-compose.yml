services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: agent, POSTGRES_PASSWORD: agent, POSTGRES_DB: agent }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U agent -d agent"], interval: 3s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 3s, retries: 20 }
  api:
    build: .
    env_file: [{ path: .env, required: false }]
    environment:
      AP_DATABASE_URL: postgresql://agent:agent@db:5432/agent
      AP_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
    volumes: [reports:/app/reports]
  ingest:
    build: .
    command: ["python", "-m", "agentplatform.cli", "ingest", "corpus"]
    environment: { AP_DATABASE_URL: "postgresql://agent:agent@db:5432/agent" }
    depends_on: { db: { condition: service_healthy } }
    profiles: ["tools"]
volumes: { pgdata: {}, reports: {} }
