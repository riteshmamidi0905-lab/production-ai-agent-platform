name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check agentplatform tests --select E9,F63,F7,F82,F401
      - name: UI syntax
        run: node --check agentplatform/ui/app.js
      - name: Unit + integration tests (real PostgreSQL + pgvector, real HTTP/SSE/WebSocket)
        run: pytest -q
      - name: Evaluation regression gate
        run: python -m agentplatform.cli --embedded-pg eval --repeats 2 --gate --out eval-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: eval-report.json }
  compose-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build db redis api
      - run: docker compose run --rm ingest
      - run: pip install httpx && python scripts/smoke.py http://localhost:8000
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
